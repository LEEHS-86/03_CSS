<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Practice6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="list-container">
        <div class="list-header">
            <div class="header-title">
                <h2>Device Management</h2>
                <span class="device-count">Total 4 Devices</span>
            </div>
            <div class="btn-add">+ Add Device</div>
        </div>
        <table class="data-table">
            <thead>
            <tr>
                <th>DEVICE NAME</th>
                <th>LOCATION</th>
                <th>STATUS</th>
                <th>BATTERY</th>
                <th>ACTIONS</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>
                    <div class="device-info">
                        <div class="icon-box icon-light"></div>
                        <span class="device-name">Smart Bulb A</span>
                    </div>
                </td>
                <td>Living Room</td>
                <td>
                    <div class="status-badge badge-online">
                        <div class="status-dot"></div>
                        <span>Online</span>
                    </div>
                </td>
                <td>
                    <div class="battery-wrapper">
                        <div class="battery-bar">
                            <div class="battery-fill" style=" width: 85%"></div>
                        </div>
                        <span class="battery-text">85%</span>
                    </div>
                <td>
                    <button class="btn-edit">Edit</button>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="device-info">
                        <div class="icon-box icon-light2"></div>
                        <span class="device-name">Main Tehmostat</span>
                    </div>
                </td>
                <td>Hallway</td>
                <td>
                    <div class="status-badge badge-offline">
                        <div class="status-dot"></div>
                        <span>offline</span>
                    </div>
                </td>
                <td>
                    <div class="battery-wrapper">
                        <div class="battery-bar">
                            <div class="battery-point" style=" width: 15%" ></div>
                        </div>
                        <span class="battery-text">15%</span>
                    </div>
                <td>
                    <button class="btn-edit">Edit</button>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="device-info">
                        <div class="icon-box icon-light3"></div>
                        <span class="device-name">Coffee Maker Plug</span>
                    </div>
                </td>
                <td>Kitchen</td>
                <td>
                    <div class="status-badge badge-online">
                        <div class="status-dot"></div>
                        <span>Online</span>
                    </div>
                </td>
                <td>
                    <div class="battery-wrapper">
                        <div class="aa">Plugged In</div>
                        <span class="battery-text"></span>
                    </div>
                <td>
                    <button class="btn-edit">Edit</button>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="device-info">
                        <div class="icon-box icon-light4"></div>
                        <span class="device-name">Front Door Camera</span>
                    </div>
                </td>
                <td>Porch</td>
                <td>
                    <div class="status-badge badge-standby">
                        <div class="status-dot"></div>
                        <span>standby</span>
                    </div>
                </td>
                <td>
                    <div class="battery-wrapper">
                        <div class="battery-bar">
                            <div class="battery-fill4"></div>
                        </div>
                        <span class="battery-text">60%</span>
                    </div>
                <td>
                    <button class="btn-edit">Edit</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
